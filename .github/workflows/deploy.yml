name: Deploy to cPanel

on:
  push:
    branches:
      - main  # Triggers on push to main
  pull_request:
    branches:
      - main  # Triggers on PR merge to main
    types: [closed]

jobs:
  deploy:
    if: github.event.pull_request.merged == true || github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'  # Specify your PHP version
          tools: composer

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'  # Specify your Node.js version

      - name: Install NPM dependencies
        run: npm install

      - name: Build assets
        run: npm run build

      - name: Deploy public folder to cPanel public_html
        uses: SamKirkland/FTP-Deploy-Action@4.2.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public/  # Path to your public directory
          server-dir: public_html/  # Path on your cPanel server
          exclude: |
            public/index.php

      - name: Deploy other files to cPanel website directory
        uses: SamKirkland/FTP-Deploy-Action@4.2.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./  # Path to your local directory (root of the repository)
          server-dir: website/  # Path on your cPanel server
          exclude: |
            .git/**/*
            .github/**/*
            node_modules/**/*
            vendor/**/*
            .env
